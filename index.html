<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>😂 VR Paidata | Tamil Comedy</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#4c1d95);
    color:white;
}

.container{
    max-width:600px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:rgba(255,255,255,0.10);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

h1{
    font-size:32px;
    margin-bottom:5px;
}

.subtitle{
    color:#ddd;
    margin-bottom:25px;
}

.follow,
.copy,
.share{
    width:100%;
    display:block;
    border:0;
    padding:16px;
    margin:12px 0;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    color:white;
    text-decoration:none;
    cursor:pointer;
}

.instagram{
    background:#e1306c;
}

.facebook{
    background:#1877f2;
}

.copy{
    background:#7c3aed;
}

.share{
    background:#059669;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.stat{
    background:rgba(0,0,0,.25);
    padding:18px;
    border-radius:15px;
}

.number{
    font-size:28px;
    font-weight:bold;
}

.label{
    font-size:12px;
    color:#ccc;
}

.footer{
    font-size:12px;
    color:#bbb;
    margin-top:25px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>😂 VR Paidata</h1>

<p class="subtitle">
Tamil Comedy • AI Animation • Fun Videos
</p>

<!-- INSTAGRAM -->

<a
class="follow instagram"
href="https://www.instagram.com/vrpaidata/"
target="_blank"
rel="noopener">
📸 Instagram-ல் Follow செய்யுங்கள்
</a>


<!-- FACEBOOK -->

<a
class="follow facebook"
href="https://www.facebook.com/share/19PZBhTyHL/"
target="_blank"
rel="noopener">
👍 Facebook-ல் Follow செய்யுங்கள்
</a>


<!-- COPY -->

<button
class="copy"
onclick="copyReferral()">
🔗 Referral Link Copy
</button>


<!-- SHARE -->

<button
class="share"
onclick="sharePage()">
📤 இந்த Page-ஐ Share செய்யுங்கள்
</button>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div
class="number"
id="views">
0
</div>

<div class="label">
Page Views
</div>

</div>


<div class="stat">

<div
class="number"
id="shares">
0
</div>

<div class="label">
Share Clicks
</div>

</div>

</div>


<div class="footer">

😂 உங்கள் நண்பர்களுக்கும் இந்த page-ஐ அனுப்புங்கள்!

<br><br>

Page Views & Share Clicks Supabase database மூலம் கணக்கிடப்படுகிறது.

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://saesruoufprdchtnbedk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdTvNMS3TgS5Pe9yyQS7pg_UlsTsqf9";


/* =========================
   COMMON REQUEST
========================= */

async function supabaseRequest(table, options = {}){

    return fetch(
        SUPABASE_URL + "/rest/v1/" + table,
        {
            ...options,

            headers:{
                "apikey":SUPABASE_KEY,

                "Authorization":
                "Bearer " + SUPABASE_KEY,

                "Content-Type":
                "application/json",

                ...(options.headers || {})
            }
        }
    );
}


/* =========================
   ADD VISITOR
========================= */

async function addPageView(){

    try{

        const response =
        await supabaseRequest(
            "Visitors",
            {
                method:"POST",

                body:JSON.stringify({
                    Vister:1
                })
            }
        );


        if(!response.ok){

            console.log(
                "Visitor error:",
                await response.text()
            );

        }

    }catch(error){

        console.log(
            "Visitor error:",
            error
        );

    }

}


/* =========================
   GET VISITOR COUNT
========================= */

async function getPageViews(){

    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/Visitors?select=id",
            {
                method:"GET",

                headers:{
                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Prefer":
                    "count=exact",

                    "Range":
                    "0-0"
                }
            }
        );


        const range =
        response.headers.get(
            "content-range"
        );


        if(range){

            const total =
            range.split("/")[1];

            document.getElementById(
                "views"
            ).textContent =
            total || "0";

        }

    }catch(error){

        console.log(
            "View count error:",
            error
        );

    }

}


/* =========================
   ADD SHARE
========================= */

async function addShare(){

    try{

        const response =
        await supabaseRequest(
            "Share",
            {
                method:"POST",

                body:JSON.stringify({
                    Share:1
                })
            }
        );


        if(!response.ok){

            console.log(
                "Share error:",
                await response.text()
            );

            return;
        }


        getShareCount();

    }catch(error){

        console.log(
            "Share error:",
            error
        );

    }

}


/* =========================
   GET SHARE COUNT
========================= */

async function getShareCount(){

    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/Share?select=id",
            {
                method:"GET",

                headers:{
                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Prefer":
                    "count=exact",

                    "Range":
                    "0-0"
                }
            }
        );


        const range =
        response.headers.get(
            "content-range"
        );


        if(range){

            const total =
            range.split("/")[1];

            document.getElementById(
                "shares"
            ).textContent =
            total || "0";

        }

    }catch(error){

        console.log(
            "Share count error:",
            error
        );

    }

}


/* =========================
   REFERRAL LINK
========================= */

function getReferralLink(){

    let id =
    localStorage.getItem(
        "vr_ref_id"
    );


    if(!id){

        id =
        "VR" +
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

        localStorage.setItem(
            "vr_ref_id",
            id
        );

    }


    return (
        location.origin +
        location.pathname +
        "?ref=" +
        id
    );

}


/* =========================
   COPY REFERRAL
========================= */

async function copyReferral(){

    const link =
    getReferralLink();


    try{

        await navigator.clipboard
        .writeText(link);

        alert(
            "Referral link copied! 🔗"
        );

        /*
         Optional:
         Copy button is NOT counted
         as a real share.
        */

    }catch(error){

        prompt(
            "இந்த link-ஐ Copy செய்யுங்கள்:",
            link
        );

    }

}


/* =========================
   SHARE PAGE
========================= */

async function sharePage(){

    const link =
    getReferralLink();


    /* Native share */

    if(navigator.share){

        try{

            await navigator.share({

                title:
                "😂 VR Paidata",

                text:
                "😂 VR Paidata - Tamil Comedy • AI Animation • Fun Videos",

                url:
                link

            });


            /*
             Share completed
             → record one share
            */

            await addShare();

        }catch(error){

            /*
             User cancelled share
             → don't count
            */

            console.log(
                "Share cancelled"
            );

        }

        return;
    }


    /* Browser without Web Share API */

    try{

        await navigator.clipboard
        .writeText(link);

        alert(
            "Link copied! 📋"
        );

        await addShare();

    }catch(error){

        prompt(
            "இந்த link-ஐ Share செய்யுங்கள்:",
            link
        );

    }

}


/* =========================
   START
========================= */

getPageViews();

getShareCount();

addPageView();

</script>

</body>
</html>
