<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://saesruoufprdchtnbedk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdTvNMS3TgS5Pe9yyQS7pg_UlsTsqf9";


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(
    table,
    options = {}
){

    const response =
    await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        table,
        {
            ...options,

            headers:{
                "apikey":
                SUPABASE_KEY,

                "Authorization":
                "Bearer " +
                SUPABASE_KEY,

                "Content-Type":
                "application/json",

                "Prefer":
                "return=minimal",

                ...(options.headers || {})
            }
        }
    );

    return response;
}


/* =========================
   ADD PAGE VIEW
========================= */

async function addPageView(){

    try{

        const response =
        await supabaseRequest(
            "Visitors",
            {
                method:"POST",

                body:JSON.stringify({})
            }
        );


        if(!response.ok){

            console.log(
                "Visitor insert failed:",
                response.status,
                await response.text()
            );

        }

    }catch(error){

        console.log(
            "Page view error:",
            error
        );

    }

    getPageViews();

}


/* =========================
   GET PAGE VIEW COUNT
========================= */

async function getPageViews(){

    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/Visitors?select=id",

            {
                method:"GET",

                headers:{

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Prefer":
                    "count=exact",

                    "Range":
                    "0-0"

                }

            }

        );


        if(!response.ok){

            console.log(
                "View count failed:",
                response.status,
                await response.text()
            );

            return;

        }


        const contentRange =
        response.headers.get(
            "content-range"
        );


        if(contentRange){

            const total =
            contentRange
            .split("/")[1];


            document.getElementById(
                "views"
            ).innerText =
            total || "0";

        }

    }catch(error){

        console.log(
            "View count error:",
            error
        );

    }

}


/* =========================
   ADD SHARE
========================= */

async function recordShare(){

    try{

        const response =
        await supabaseRequest(
            "Share",
            {
                method:"POST",

                body:JSON.stringify({})
            }
        );


        if(!response.ok){

            console.log(
                "Share insert failed:",
                response.status,
                await response.text()
            );

            return;

        }


        getShareCount();

    }catch(error){

        console.log(
            "Share error:",
            error
        );

    }

}


/* =========================
   GET SHARE COUNT
========================= */

async function getShareCount(){

    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/Share?select=id",

            {
                method:"GET",

                headers:{

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                    "Prefer":
                    "count=exact",

                    "Range":
                    "0-0"

                }

            }

        );


        if(!response.ok){

            console.log(
                "Share count failed:",
                response.status,
                await response.text()
            );

            return;

        }


        const contentRange =
        response.headers.get(
            "content-range"
        );


        if(contentRange){

            const total =
            contentRange
            .split("/")[1];


            document.getElementById(
                "shares"
            ).innerText =
            total || "0";

        }

    }catch(error){

        console.log(
            "Share count error:",
            error
        );

    }

}


/* =========================
   REFERRAL LINK
========================= */

function getReferralLink(){

    let id =
    localStorage.getItem(
        "vr_ref_id"
    );


    if(!id){

        id =
        "VR" +
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();


        localStorage.setItem(
            "vr_ref_id",
            id
        );

    }


    return (
        location.origin +
        location.pathname +
        "?ref=" +
        id
    );

}


/* =========================
   COPY REFERRAL
========================= */

async function copyReferral(){

    const link =
    getReferralLink();


    try{

        await navigator.clipboard
        .writeText(link);


        alert(
            "Referral link copied! 🔗"
        );


    }catch(error){

        prompt(
            "இந்த link-ஐ Copy செய்யுங்கள்:",
            link
        );

    }

}


/* =========================
   SHARE PAGE
========================= */

async function sharePage(){

    const link =
    getReferralLink();


    /* =====================
       NATIVE SHARE
    ===================== */

    if(navigator.share){

        try{

            await navigator.share({

                title:
                "😂 VR Paidata",

                text:
                "😂 VR Paidata - Tamil Comedy • AI Animation • Fun Videos",

                url:
                link

            });


            /* Record only after
               successful share */

            await recordShare();


        }catch(error){

            console.log(
                "Share cancelled:",
                error
            );

        }

        return;

    }


    /* =====================
       FALLBACK
    ===================== */

    try{

        await navigator.clipboard
        .writeText(link);


        alert(
            "Link copied! 📋"
        );


        await recordShare();


    }catch(error){

        prompt(
            "இந்த link-ஐ Share செய்யுங்கள்:",
            link
        );

    }

}


/* =========================
   INITIAL LOAD
========================= */

getPageViews();

getShareCount();

addPageView();


</script>
