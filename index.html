<script>

const SUPABASE_URL =
"https://saesruoufprdchtnbedk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YdTvNMS3TgS5Pe9yyQS7pg_UlsTsqf9";

/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(table, options = {}) {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + table,
        {
            ...options,
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=representation",
                ...(options.headers || {})
            }
        }
    );

    if (!response.ok) {
        throw new Error(await response.text());
    }

    return response;
}


/* =========================
   PAGE VIEWS
========================= */

async function recordPageView() {

    try {

        await supabaseRequest("Visitors", {
            method: "POST",
            body: JSON.stringify({})
        });

        await updateViewCount();

    } catch (error) {

        console.log("Page view error:", error);

    }
}


async function updateViewCount() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/Visitors?select=id",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        document.getElementById("views").innerText =
            data.length;

    } catch (error) {

        console.log("View count error:", error);

    }
}


/* =========================
   SHARE COUNT
========================= */

async function updateShareCount() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/Shares?select=id",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        document.getElementById("shares").innerText =
            data.length;

    } catch (error) {

        console.log("Share count error:", error);

    }
}


/* =========================
   SHARE BUTTON
========================= */

async function sharePage() {

    const link = window.location.href;

    try {

        /* Save share click */

        await supabaseRequest("Shares", {
            method: "POST",
            body: JSON.stringify({})
        });

        /* Update number immediately */

        await updateShareCount();


        /* Open sharing */

        if (navigator.share) {

            try {

                await navigator.share({
                    title: "VR Paidata",
                    text: "😂 இந்த Tamil Comedy page-ஐ பாருங்க!",
                    url: link
                });

            } catch (error) {

                console.log("Share cancelled");

            }

        } else {

            await navigator.clipboard.writeText(link);

            alert(
                "🔗 Link copied!\nநண்பர்களுக்கு share செய்யுங்கள் 😂"
            );

        }

    } catch (error) {

        console.log("Share error:", error);

        alert(
            "Share count save ஆகவில்லை. Supabase policy-ஐ check செய்யுங்கள்."
        );

    }
}
